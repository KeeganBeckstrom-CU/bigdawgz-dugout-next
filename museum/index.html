const STORY={"m21": ["After the Civil War, baseball clubs were mostly gentlemen who played for fun. A few teams quietly slipped money to their best players, but nobody admitted it.", "In 1869 the Cincinnati Red Stockings decided to say it out loud: every man on the roster would be paid. Critics said a team of hired players would never last.", "They rode trains from New York to California, beat everyone in their path, and went the entire season without a loss. Crowds packed the fields just to see them.", "Every professional team since, from the minor leagues to the World Series champions, traces its family tree back to that train full of paid ballplayers."], "m22": ["By 1903 there were two big leagues, and they had spent two years fighting over players like rival kids on a playground.", "Boston and Pittsburgh, the two champions, agreed to settle it on the field in a best-of-nine series. Pittsburgh jumped ahead three games to one.", "Boston stormed back and won four straight. Crowds overflowed onto the field and stood behind ropes in the outfield to watch.", "They called it the World Series. It has been played almost every October since, and winning it is still the dream of every big leaguer."], "m1": ["In 1908 a songwriter named Jack Norworth was riding a New York subway when he spotted a poster for a ballgame at the Polo Grounds.", "He had never been to a big-league game. Before the train reached his stop, he scribbled a song on a scrap of paper about a fan named Katie who just wanted to go to the park.", "The song was Take Me Out to the Ball Game, and it caught on everywhere, sung in theaters and on street corners long before radios.", "More than a hundred years later, every ballpark stands and sings it in the seventh-inning stretch. Norworth finally went to his first game in 1940."], "m23": ["Boston built a new brick ballpark squeezed into a city block, so the left-field wall had to be tall and close.", "Opening day was set for April 20, 1912, but five days earlier the Titanic sank, and the newspapers were full of the disaster.", "Fenway Park opened in front of about 27,000 fans, and Boston won in extra innings. That fall the Red Sox won the World Series.", "Fenway is now the oldest big-league ballpark still in use. The wall became the Green Monster, and you can sit where fans sat in 1912."], "m24": ["In 1919 the Chicago White Sox were the best team in baseball, but their owner paid them poorly, and gamblers were lurking around the game.", "Before the World Series, gamblers offered some Chicago players money to lose on purpose. Eight players were in on the plan.", "Chicago lost the Series to Cincinnati. A year later the truth came out in court, and the new commissioner banned all eight for life.", "The team became known as the Black Sox. Since then, baseball has treated honesty as part of the uniform. You play to win, every time."], "m2": ["In 1920 Black players were shut out of the major leagues, no matter how good they were.", "Rube Foster, a star pitcher turned owner, believed they deserved a league of their own, run by Black owners. He called team owners to a meeting in Kansas City.", "At the Paseo YMCA on February 13, 1920, they founded the Negro National League. Foster's motto was \"We are the ship, all else the sea.\"", "The league launched legends like Satchel Paige, Josh Gibson and Oscar Charleston, and it proved the talent that would change the majors in 1947."], "m25": ["In the early 1920s Babe Ruth was hitting so many home runs that the Yankees drew more fans than the stadium they shared could hold.", "So the Yankees built their own giant ballpark in the Bronx, the first with three decks, and more than 60,000 fans packed in for opening day, April 18, 1923.", "In the third inning, Ruth hit a three-run home run into the right-field seats. A writer called the ballpark the House That Ruth Built.", "The nickname stuck for 85 years. The Yankees went on to win their first World Series that October."], "m3": ["In 1927 the Yankees had a lineup so scary it was nicknamed Murderers' Row, and Babe Ruth was its heart.", "Ruth's own record was 59 home runs. With two games left in the season, he had 59 again.", "On September 30 he lined a pitch into the right-field seats for number 60. He hit more home runs that year than every other American League team.", "The record stood for 34 years. The home run went from a rare surprise to the most exciting play in sports."], "m4": ["It was Game 3 of the 1932 World Series at Wrigley Field, and the Chicago players and fans were yelling at Babe Ruth from the dugout and stands.", "Ruth took two strikes. Then he raised his hand and gestured, maybe toward the bench, maybe toward center field.", "On the next pitch he hit one of the longest home runs ever seen at Wrigley, deep over the center-field wall.", "Did he really call his shot? People who were there disagreed. The story became baseball's most famous legend, and the Yankees swept the Series."], "m26": ["In 1933 Chicago was hosting a World's Fair, and a sports editor named Arch Ward had an idea: put the best players from both leagues in one game.", "Fans voted on who should play, just like today. Babe Ruth, now 38, was on the American League team.", "On July 6 at Comiskey Park, Ruth hit the first home run in All-Star history, and the American League won 4 to 2.", "It was supposed to happen once. It became the Midsummer Classic, still one of the best nights of every summer."], "m27": ["In 1935 almost every big-league game was played in the afternoon, when most people were at work.", "The Cincinnati Reds installed giant light towers. Many owners thought night baseball was a silly gimmick.", "On May 24, President Franklin Roosevelt pressed a button at the White House, and the lights blazed on in Cincinnati for the first major league night game.", "Working families could finally come to the ballpark. Today most games are played under the lights."], "m28": ["By 1936 baseball was almost 100 years old, and people wanted a way to honor its greatest players forever.", "Writers voted on who deserved to go first. A player needed votes on three out of every four ballots, and many stars fell short.", "Five made it: Ty Cobb, Babe Ruth, Honus Wagner, Christy Mathewson and Walter Johnson. Cobb got the most votes of all.", "They became the first plaques in the Hall of Fame. Getting voted in is still the highest honor in baseball."], "m5": ["Lou Gehrig played in 2,130 games in a row, through injuries, sickness and slumps. They called him the Iron Horse.", "In 1939 his body suddenly stopped working right. He took himself out of the lineup, and doctors found a terrible illness that today carries his name.", "On July 4 the Yankees held a day for him. With 62,000 fans silent, he told them he considered himself the luckiest man on the face of the earth.", "He died two years later. His speech is still the most famous in sports, a lesson in gratitude when life gets hard."], "m29": ["Baseball's leaders wanted a home for its history, and they chose Cooperstown, a tiny village in upstate New York.", "For three years the plaques waited. Then, in 1939, the museum was ready to open its doors.", "On June 12 the living legends came, including Babe Ruth, Ty Cobb, Honus Wagner and Cy Young, and a game was played at nearby Doubleday Field.", "Every summer since, new legends are welcomed into the Hall. It's where baseball keeps its memories, and where the BigDawgz are headed."], "m6": ["Going into the last day of 1941, Ted Williams was hitting .3996. The rules would round it up to .400.", "His manager offered to let him sit out the doubleheader and keep his .400 safe. Williams said no.", "He played both games and got six hits in eight at-bats, finishing at .406.", "Nobody has hit .400 since. He chose to earn it instead of protecting it."], "m30": ["On May 15, 1941, Joe DiMaggio got one hit. Then he got a hit the next day, and the next.", "By July the whole country was following the streak on the radio. He passed the old record of 44 games and kept going.", "He reached 56 straight games with a hit. In Cleveland on July 17, two great plays by the third baseman finally stopped him.", "He started a new 16-game streak the very next day. No one has come closer than 44 since."], "m7": ["In 1943 many big leaguers were away fighting in World War II, and owners worried ballparks would go empty.", "Chewing gum owner Philip Wrigley started a professional league for women. Players had to attend charm school and play in skirts.", "They slid into bases with bare legs, threw hard, and drew big crowds in Midwest towns like Grand Rapids, Kalamazoo and Muskegon right here in Michigan.", "About 600 women played over 12 seasons. A movie about them later reminded everyone that there's no crying in baseball."], "m8": ["For more than 50 years, Black players were kept out of the major leagues. Brooklyn's Branch Rickey chose Jackie Robinson to change that.", "Rickey warned him he would face insults and threats and could not fight back. Robinson promised he would answer with his play.", "On April 15, 1947, Robinson played first base for Brooklyn at Ebbets Field and became the first Black player in the modern major leagues.", "He won the first Rookie of the Year award and changed America. Every April 15, every player in baseball wears his number, 42."], "m31": ["Eleven weeks after Jackie Robinson's debut, Cleveland signed Larry Doby, a star second baseman from the Negro Leagues.", "He went straight from the Negro Leagues to the majors with no time in the minors, and some teammates refused to shake his hand.", "On July 5, 1947, Doby became the first Black player in the American League.", "A year later he helped Cleveland win the World Series. He later became the second Black manager in big-league history and made the Hall of Fame."], "m32": ["Satchel Paige was the most famous pitcher in the Negro Leagues, pitching for two decades and thousands of games.", "When the majors finally opened up, many people said he was too old. He was 42.", "On July 9, 1948, Paige debuted for Cleveland, and that fall he helped them win the World Series.", "He pitched in the majors again at age 59. He liked to say, \"Age is a question of mind over matter. If you don't mind, it doesn't matter.\""], "m9": ["In 1951 the New York Giants were 13 games behind Brooklyn in August, then won 37 of their last 44 to tie.", "They played a three-game playoff. In the bottom of the ninth of Game 3, the Giants trailed 4 to 2 with two runners on.", "Bobby Thomson lined a pitch into the left-field seats. The radio announcer screamed \"The Giants win the pennant!\" over and over.", "They called it the Shot Heard 'Round the World. It's the walk-off every kid practices in the backyard."], "m10": ["Game 1 of the 1954 World Series was tied 2 to 2 in the eighth inning, with two Cleveland runners on base.", "Vic Wertz crushed a ball to the deepest part of the Polo Grounds, more than 420 feet from home plate.", "Willie Mays sprinted with his back to the plate and caught it over his shoulder, then spun and fired the ball back to the infield to stop the runners.", "The Giants won in extra innings and swept the Series. It's still called simply The Catch."], "m33": ["The Brooklyn Dodgers lost the World Series to the Yankees in 1941, 1947, 1949, 1952 and 1953.", "Every time, their fans said the same thing: \"Wait till next year.\" In 1955 it came down to Game 7 at Yankee Stadium.", "Johnny Podres pitched a shutout, Sandy Amorós made a running catch in left, and Brooklyn won 2 to 0.", "The whole borough partied in the streets all night. Next year had finally arrived."], "m11": ["Don Larsen had been knocked out early in Game 2 of the 1956 World Series. Nobody expected much from him in Game 5.", "Inning after inning, he set the Dodgers down: no hits, no walks, no runners at all. Teammates stopped talking to him so they wouldn't jinx it.", "With two outs in the ninth, he struck out the 27th batter, and catcher Yogi Berra leaped into his arms.", "It's still the only perfect game in World Series history."], "m12": ["Game 7 of the 1960 World Series was a wild one: the lead flipped back and forth, and it was tied 9 to 9 going to the bottom of the ninth.", "Pittsburgh's leadoff man was Bill Mazeroski, famous for his glove, not his bat.", "On the second pitch he hit the ball over the left-field wall at Forbes Field. He circled the bases waving his helmet while fans poured onto the field.", "It's still the only home run ever to end a Game 7 of the World Series."], "m34": ["In 1961 two Yankees chased Babe Ruth's record of 60 home runs: Mickey Mantle and Roger Maris.", "Mantle got hurt in September. Maris kept going, but the pressure was so heavy that his hair started falling out, and some fans booed him for chasing Ruth.", "On the last day of the season, October 1, Maris hit number 61 into the right-field seats.", "His record stood for 37 years. Today the American League's record is 62, held by another Yankee."], "m35": ["Sandy Koufax threw so hard and his curveball dropped so sharply that hitters said it was like it fell off a table.", "On September 9, 1965, against the Cubs, he set down batter after batter. In the ninth inning, the crowd was on its feet for every pitch.", "He struck out the last six batters and finished a perfect game with 14 strikeouts. The other pitcher allowed only one hit, the fewest ever by two teams.", "It was his fourth no-hitter in four years, a record at the time."], "m36": ["In 1966 the Red Sox finished in ninth place. Nobody gave them a chance in 1967.", "Four teams were in a race all summer. It came down to the last weekend, and Boston needed to win its final two games.", "Carl Yastrzemski got seven hits in eight at-bats that weekend, Boston won both, and the Red Sox took the pennant. Yaz won the Triple Crown.", "Fans called it the Impossible Dream. The next Triple Crown wouldn't come for 45 years, and a Detroit Tiger won it."], "m13": ["1968 was a hard year for Detroit, still hurting from riots the summer before. The Tigers became something the whole city could cheer for.", "In the World Series, St. Louis led three games to one. One more loss and it was over.", "Mickey Lolich won Game 5, Detroit won Game 6, and Lolich came back on two days of rest to beat the great Bob Gibson in Game 7.", "Lolich won three games in one World Series. Detroit celebrated together all night."], "m37": ["The New York Mets started in 1962 and were so bad they lost 120 games their first year.", "In 1969 they were in third place in August, nine games back. Then they caught fire and won 38 of their last 49.", "They swept Atlanta in the playoffs and beat the heavily favored Baltimore Orioles in five games to win the World Series.", "They're still called the Miracle Mets. Yesterday's last-place team can be tomorrow's champion."], "m38": ["In 1969 players couldn't choose where they played. A rule called the reserve clause tied them to one team forever.", "That October, St. Louis traded Curt Flood to Philadelphia without asking him. He refused to go.", "Flood sued baseball, saying a player should not be traded like property. He took his case all the way to the Supreme Court and lost.", "He gave up his career, but his fight led to free agency a few years later, letting players choose their teams."], "m39": ["Roberto Clemente grew up in Puerto Rico and became one of the greatest right fielders ever, with a cannon for an arm.", "In 1972, he was 37 and stuck on 2,999 hits as the season wound down.", "On September 30 he lined a double into the gap for his 3,000th hit and tipped his cap from second base.", "Three months later he died in a plane crash while flying relief supplies to earthquake victims in Nicaragua. Baseball's top award for service is named for him."], "m14": ["Hank Aaron grew up in Mobile, Alabama, practicing by hitting bottle caps with a broomstick.", "As he chased Babe Ruth's record of 714 home runs, he received thousands of hateful letters and threats because he was Black. He kept swinging.", "On April 8, 1974, in Atlanta, he hit number 715 over the left-field fence. Fireworks went off and his mom hugged him at home plate.", "He finished with 755 home runs. He's remembered for his grace under pressure as much as his power."], "m15": ["Game 6 of the 1975 World Series at Fenway Park was tied in extra innings after one of the best games ever played.", "It was after midnight in the bottom of the 12th. Boston faced elimination if they lost.", "Carlton Fisk hit a long fly down the left-field line. He hopped up the line waving his arms to push it fair, and it clanged off the foul pole.", "A TV camera inside the scoreboard caught his reaction, and broadcasts have shown players' faces ever since."], "m40": ["Frank Robinson was one of the best hitters ever, the only player to win MVP in both leagues.", "In 1975 Cleveland hired him as manager. He would also keep playing. No Black man had ever managed a big-league team.", "On Opening Day, April 8, he put himself in the lineup and homered in his first at-bat as manager. The crowd went wild.", "He broke a barrier in the dugout, not just on the field, and later managed four more teams."], "m41": ["Reggie Jackson joined the Yankees in 1977 and said he was the straw that stirred the drink. Not everyone loved that.", "In Game 6 of the World Series, New York could win the title.", "Jackson hit three home runs on three straight swings, each on the first pitch, off three different pitchers. The crowd chanted his name.", "New York won the championship that night. He has been called Mr. October ever since."], "m42": ["In 1978 Boston led New York by 14 games in July. Then New York came roaring back.", "They finished tied after 162 games and played one extra game at Fenway Park. Boston led 2 to 0 in the seventh.", "Bucky Dent, the light-hitting shortstop, lifted a three-run homer just over the Green Monster.", "New York won and went on to win the World Series. Anyone in the lineup can be the hero."], "m43": ["The 1979 Pittsburgh Pirates had a theme song, We Are Family, and a leader they called Pops, Willie Stargell.", "In the World Series, Baltimore led three games to one. Pittsburgh needed three straight wins.", "They won Games 5 and 6. In Game 7, Stargell, 39 years old, hit a go-ahead home run, and the Pirates won the title.", "Stargell was the MVP. A team that believes in each other is hard to beat."], "m44": ["No one had hit .400 since Ted Williams in 1941. In 1980, George Brett gave it a real chase.", "He was hitting .400 as late as the middle of September, and the whole country watched every at-bat.", "He finished at .390, the highest average since 1941.", "He won the MVP and led Kansas City to its first World Series. Chasing greatness makes everyone better."], "m45": ["Fernando Valenzuela grew up in a small village in Mexico, the youngest of 12 kids. He had a screwball almost nobody could hit.", "In 1981, the Dodgers' opening-day starter got hurt, and the 20-year-old rookie was handed the ball.", "He won his first eight starts, five of them shutouts, looking up to the sky before every pitch.", "He became the first pitcher to win Rookie of the Year and the Cy Young in the same season. Fans called it Fernandomania."], "m46": ["Rickey Henderson was so fast that pitchers threw over to first again and again just to slow him down.", "In 1982, he chased Lou Brock's single-season record of 118 stolen bases.", "On August 27, he stole number 119, pulled the base out of the ground and held it over his head.", "He finished with 130 steals. Nobody has come within 20 of that since."], "m47": ["In 1984 the Detroit Tigers had a manager named Sparky Anderson and a young core that had grown up together.", "They won 35 of their first 40 games, the best start in history, and everyone waited for them to cool off.", "They never did. Detroit was in first place every single day of the season and beat San Diego in the World Series.", "It was Detroit's fourth World Series title. Start strong and never let go."], "m48": ["Pete Rose played every game like his hair was on fire. They called him Charlie Hustle.", "In 1985 he chased Ty Cobb's record of 4,191 hits, a mark that had stood for 57 years.", "On September 11 in Cincinnati, he lined a single to left for hit number 4,192, and the crowd cheered for seven minutes.", "He was later banned for betting on baseball, and his plaque has never hung in the Hall of Fame. Records last, and so do choices."], "m49": ["Roger Clemens had arm surgery in 1985, and some people wondered if he would ever be great.", "On April 29, 1986, against Seattle at Fenway Park, he struck out batter after batter.", "He set a new record with 20 strikeouts in a nine-inning game, and he didn't walk anyone.", "Power with control. He went on to win the first of seven Cy Young Awards that year."], "m50": ["In Game 6 of the 1986 World Series, Boston led the Mets by two runs in the 10th inning.", "The Mets had two outs and nobody on. Boston was one out away from its first title since 1918.", "Three straight singles, a wild pitch, and then Mookie Wilson's slow grounder rolled through the first baseman's legs, and the winning run scored.", "The Mets won Game 7 too. It isn't over until the last out."], "m51": ["The Minnesota Twins played in a dome so loud it was like being inside a drum.", "In the 1987 World Series, fans waved white Homer Hankies, and the noise was louder than a jet engine.", "The Twins won all four games at home, including Game 7, for Minnesota's first World Series title.", "A home crowd can be a tenth player."], "m16": ["Kirk Gibson grew up in Pontiac, Michigan. In the 1988 World Series he was hurt in both legs and wasn't supposed to play.", "In the bottom of the ninth of Game 1, the Dodgers trailed by one with a runner on and two outs, facing the best closer in baseball.", "Gibson limped up to pinch-hit, fouled off pitches, worked a full count and hit a backdoor slider over the right-field wall.", "He pumped his fist as he limped around the bases. The Dodgers won the World Series."], "m52": ["Orel Hershiser was a skinny pitcher with a nickname from his manager: Bulldog.", "At the end of 1988 he started a scoreless streak, and the zeros kept coming, start after start.", "He pitched 59 straight scoreless innings, breaking Don Drysdale's record of 58.", "Then he was named the MVP of the NLCS and the World Series. Consistency is a superpower."], "m53": ["The 1989 World Series was the Bay Bridge Series: Oakland against San Francisco.", "Minutes before Game 3 at Candlestick Park, the ground began to shake. A powerful earthquake rocked the Bay Area.", "Because it was World Series night, many people were home watching instead of on the highways. The game was called off as players gathered their families.", "The Series resumed 10 days later. Some things matter more than games, and baseball came back to help the city heal."], "m54": ["Ken Griffey Sr. played for the Big Red Machine. His son, Ken Griffey Jr., grew up in big-league clubhouses.", "In 1990 Junior was a star for Seattle, and the Mariners signed his dad. They became the first father and son to play on the same team.", "On September 14 in the first inning, Senior hit a home run, then Junior hit one right after him.", "They're the only father and son ever to hit back-to-back home runs. Playing catch with your dad, all the way to the big leagues."], "m55": ["May 1, 1991 started like any other day on the baseball calendar.", "That afternoon in Oakland, Rickey Henderson needed one stolen base to pass Lou Brock as the all-time leader.", "He swiped third for number 939 and lifted the base over his head. That night in Texas, 44-year-old Nolan Ryan threw his record seventh no-hitter.", "Two all-time records in one day. History can happen twice before bedtime."], "m56": ["Jack Morris pitched 14 seasons for the Tigers before going home to Minnesota in 1991.", "Game 7 of the World Series against Atlanta was scoreless inning after inning. After nine, his manager wanted to take him out.", "Morris refused. He pitched a 10th scoreless inning, and Minnesota won 1 to 0 on a single in the bottom of the 10th.", "It's one of the greatest pitching performances ever. Finish what you start."], "m57": ["Game 7 of the 1992 NLCS: Pittsburgh led Atlanta 2 to 0 going into the bottom of the ninth.", "Atlanta loaded the bases and scored a run. With two outs, a little-used pinch-hitter, Francisco Cabrera, stepped in.", "He lined a single to left. Sid Bream, one of the slowest runners on the team, chugged around third and slid home just ahead of the throw.", "Atlanta went to the World Series. Run hard on every play."], "m58": ["Toronto won the World Series in 1992 and wanted to do it again in 1993.", "In Game 6, Philadelphia led 6 to 5 in the bottom of the ninth. Two runners were on base, and Joe Carter came up.", "On a 2-and-2 pitch, Carter hit a three-run homer over the left-field wall and leaped all the way around the bases.", "It was only the second home run ever to end a World Series. The announcer told him to touch 'em all."], "m17": ["Lou Gehrig's streak of 2,130 straight games had stood for 56 years. People called it unbreakable.", "Cal Ripken Jr. hadn't missed a game since 1982. On September 6, 1995, he needed one more.", "When the game became official in the fifth inning, the crowd stood for 22 minutes. Ripken took a lap around the ballpark, shaking fans' hands.", "He kept going until 2,632 straight games. Show up every day."], "m59": ["In 1995 the Seattle Mariners had never won a playoff series, and the team might move to another city.", "In Game 5 of the playoffs against New York, Seattle trailed by one run in the 11th inning.", "Edgar Martinez lined a double down the left-field line, and Ken Griffey Jr. raced all the way home from first with the winning run.", "The win helped convince Seattle to build a new ballpark and keep the team. One swing helped keep a team in its city."], "m60": ["April 15, 1997 was the 50th anniversary of Jackie Robinson's first game.", "Baseball wanted to honor him in a way no player had ever been honored.", "At Shea Stadium, with President Clinton there, the commissioner announced that number 42 was retired by every team in baseball.", "Today every player wears 42 on April 15. Some numbers belong to everyone."], "m61": ["Kerry Wood was a 20-year-old rookie from Texas with a fastball near 100 miles per hour.", "On a gray, drizzly day at Wrigley Field in his fifth big-league start, Houston couldn't touch him.", "He struck out 20 batters and allowed only one hit, a ball that bounced off the third baseman's glove.", "He tied the record for strikeouts in a nine-inning game. Age is just a number."], "m62": ["Roger Maris's record of 61 home runs had stood since 1961.", "In 1998 two sluggers, Mark McGwire and Sammy Sosa, chased it all summer, and fans across the country followed every swing.", "McGwire hit number 62 on September 8, and Sosa came over to hug him. Both passed the old record.", "Both were later linked to steroids, which changed how fans remember the chase. How you win matters."], "m63": ["On April 23, 1999, Fernando Tatís of St. Louis came up with the bases loaded in the third inning in Los Angeles.", "He hit a grand slam. The inning kept going, the lineup came all the way around, and he came up again, bases loaded, same pitcher.", "He hit a second grand slam in the same inning.", "No other player has ever done it. His 8 RBIs in one inning is a record too."], "m64": ["The 1999 All-Star Game was at Fenway Park, Ted Williams's home for 19 seasons.", "Before the game, the 80-year-old Williams rode a golf cart onto the field to throw out the first pitch.", "The game's biggest stars left the dugouts and crowded around his cart at the mound. They didn't want to leave, and the game had to wait.", "Legends honoring a legend. The crowd cheered the whole time."], "m65": ["On September 11, 2001, terrorist attacks killed thousands of people. Baseball stopped for a week.", "On September 21 the Mets played the first big sporting event in New York since. Firefighters and police were honored before the game.", "In the eighth inning, Mike Piazza hit a go-ahead home run, and the crowd roared together for the first time in days.", "Sometimes a game helps people heal."], "m66": ["Oakland led New York two games to none in their 2001 playoff series. Game 3 was 1 to 0 in the seventh.", "Jeremy Giambi was racing home on a double. The throw from right field sailed over both cutoff men.", "Derek Jeter sprinted from shortstop to the first-base line, grabbed the ball and flipped it backhand to the catcher, who tagged Giambi out.", "New York won the game and the series. Be where nobody expects you to be."], "m67": ["Game 7 of the 2001 World Series. New York led 2 to 1 in the bottom of the ninth, and Mariano Rivera, the best closer ever, was on the mound.", "Arizona tied it and loaded the bases with one out. New York brought its infield in to stop the winning run.", "Luis Gonzalez choked up and blooped a soft single just over the shortstop's head, and the winning run scored.", "Arizona won its first title in just its fourth season. A soft hit counts just as much as a homer."], "m68": ["In Game 6 of the 2002 World Series, the Angels trailed San Francisco 5 to 0 in the seventh inning, eight outs from losing.", "Fans waved the Rally Monkey, a little stuffed monkey that showed up on the big screen when the Angels needed a comeback.", "Anaheim scored three in the seventh and three more in the eighth to win 6 to 5. Then they won Game 7.", "It was the Angels' first title. Never stop believing."], "m20": ["Boston hadn't won the World Series since 1918. In the 2004 ALCS they lost the first three games to New York.", "In Game 4 they were three outs from being swept. Dave Roberts stole second base, and Boston tied it and won in extra innings.", "Then they won Games 5, 6 and 7, the first team ever to come back from 0 and 3, and swept St. Louis in the World Series.", "As the final out landed, a total lunar eclipse turned the moon red. 86 years of waiting ended with 8 straight wins."], "m69": ["George Sisler's record of 257 hits in a season had stood since 1920, longer than almost any record in baseball.", "In 2004 Ichiro Suzuki was slapping singles all over the field. With a week left, he was closing in.", "On October 1 in Seattle, he singled for hit number 258, and his teammates rushed out to hug him. Sisler's family stood and cheered.", "He finished with 262. Small hits add up to a giant record."], "m70": ["The Chicago White Sox hadn't won the World Series since 1917, two years before the Black Sox scandal.", "In 2005 they finally got hot at the right time. They lost just one playoff game.", "They swept Houston in the World Series, and shortstop Juan Uribe threw out the last runner to end it.", "88 years of waiting were over. Patience pays off."], "m71": ["In 2003 the Tigers lost 119 games. Three years later they were in the playoffs.", "In Game 4 of the 2006 ALCS, the score was tied in the bottom of the ninth with two runners on.", "Magglio Ordóñez hit a three-run homer into the left-field seats, and Detroit swept Oakland.", "The Tigers went to their first World Series in 22 years. A Michigan night nobody forgot."], "m72": ["In September 2007, the Colorado Rockies were out of the race.", "Then they won 14 of their last 15 games, plus a one-game playoff that ended with a slide at home plate in the 13th inning.", "They swept Philadelphia and Arizona in the playoffs: 21 wins in 22 games, and their first World Series.", "Fans called it Rocktober. Get hot at the right time."], "m73": ["2008 was the last summer of old Yankee Stadium, and it hosted the All-Star Game.", "In the Home Run Derby, Josh Hamilton stepped in. He had battled addiction for years and almost lost his career.", "He hit 28 home runs in the first round, some over 500 feet. The crowd chanted his name.", "He didn't even win the derby, but nobody remembers that. A show the old ballpark never forgot."], "m74": ["Roy Halladay was one of the best pitchers in baseball for 12 years, but his teams never made the playoffs.", "In 2010 he finally got his first postseason start, Game 1 against Cincinnati.", "He threw a no-hitter, allowing only one walk.", "Only Don Larsen had ever thrown a postseason no-hitter before. He waited his whole career for October, and he was ready."], "m75": ["On June 2, 2010, Detroit's Armando Galarraga retired the first 26 batters in a row.", "One out from a perfect game, a ground ball went to first base, and Galarraga covered the bag. The runner was clearly out.", "But the umpire, Jim Joyce, called him safe. Galarraga smiled and got the next out. The umpire saw the replay and apologized in tears.", "The next day they shook hands at home plate. People remember the kindness more than the call."], "m76": ["In Game 6 of the 2011 World Series, St. Louis trailed Texas by two runs in the ninth inning.", "Two outs, two strikes: one strike from losing. David Freese, a hometown kid, tripled to tie it. In the 10th they were down to their last strike again, and tied it again.", "In the bottom of the 11th, Freese hit a walk-off home run to center field.", "The Cardinals won Game 7 too. One strike away is not out."], "m77": ["On the last night of the 2011 season, two playoff spots were still undecided.", "Tampa Bay trailed New York 7 to 0 in the eighth inning. Boston led Baltimore in the ninth. Atlanta and St. Louis were in a race too.", "Tampa came back, Boston lost in the bottom of the ninth, and minutes later Evan Longoria hit a walk-off homer to send Tampa to the playoffs.", "Every game counts, even number 162."], "m78": ["No one had won baseball's Triple Crown, leading the league in average, home runs and RBIs, since 1967.", "In 2012 Detroit's Miguel Cabrera led two categories and was neck and neck in home runs into the final week.", "He finished first in all three: .330, 44 home runs and 139 RBIs.", "The first Triple Crown in 45 years. Doing everything well, every day."], "m79": ["Mariano Rivera closed games for the Yankees for 19 seasons with one pitch, a cut fastball, and saved more games than anyone in history.", "On September 26, 2013, he pitched in his final home game. Fans knew every pitch could be his last at Yankee Stadium.", "With two outs in the ninth, his longtime teammates Derek Jeter and Andy Pettitte walked to the mound to take the ball. Rivera hugged Pettitte and cried on his shoulder.", "The crowd stood and cheered for minutes. Saying goodbye with grace."], "m80": ["Derek Jeter played 20 seasons at shortstop for the Yankees. 2014 was his last.", "In his final game at Yankee Stadium, the score was tied in the bottom of the ninth with a runner on second.", "On the first pitch, Jeter lined a single into right field, and the winning run scored. He crouched and raised his arms.", "His teammates mobbed him. Some endings are perfect."], "m81": ["In the 2014 postseason, Madison Bumgarner pitched like a machine for San Francisco.", "In Game 7 of the World Series in Kansas City, on just two days of rest, he came out of the bullpen in the fifth inning with a one-run lead.", "He threw five scoreless innings to finish the game, leaving the tying run stranded at third base for the final out.", "San Francisco won its third title in five years. Give everything when your team needs it."], "m82": ["Toronto hadn't been in the playoffs since 1993. In 2015 they reached the deciding Game 5 against Texas.", "The seventh inning was one of the wildest ever: a strange run, three errors, fans throwing things, and a tie game.", "José Bautista crushed a three-run homer, stared at it, and tossed his bat high in the air.", "Toronto won the series. Big moments deserve big joy."], "m18": ["The Chicago Cubs hadn't won the World Series since 1908, the longest wait in sports.", "In 2016 they rallied from three games to one down, and Game 7 went to extra innings. Then it started to rain, and play stopped.", "The Cubs held a team meeting in a weight room during the delay, then scored twice in the 10th and won 8 to 7.", "Millions of fans filled Chicago for the parade. Never give up on a season, even after 108 years."], "m83": ["Bartolo Colón was a 42-year-old pitcher who had been in the majors since 1997. He was not known for his hitting.", "On May 7, 2016, he came up to bat in San Diego. His helmet sometimes flew off when he swung.", "He hit a home run over the left-field fence, the first of his career, and took one of the slowest, happiest trots ever.", "His teammates gave him the silent treatment in the dugout, then mobbed him. It's never too late."], "m84": ["In May 2019 the Washington Nationals were 19 and 31. Many people said the season was over.", "They clawed back, won the Wild Card game, and upset the Dodgers and Cardinals. Their dugout danced to a kids' song, Baby Shark.", "In the World Series against Houston, the road team won every game. Washington won Game 7 on the road.", "It was the city's first World Series title since 1924. A bad start doesn't decide the finish."], "m85": ["In 2020 a pandemic stopped the world. Baseball's season started in late July and lasted just 60 games.", "Fans weren't allowed in most ballparks, so teams filled the seats with cardboard cutouts. The World Series was played at a neutral site in Texas.", "The Dodgers won Game 6 for their first title since 1988, in front of a small, masked crowd.", "Baseball found a way."], "m19": ["In the 1989 movie Field of Dreams, an Iowa farmer builds a baseball field in his cornfield, and old ballplayers walk out of the corn.", "In 2021 MLB built a real ballpark next to the movie field in Dyersville, Iowa, and the Yankees and White Sox came to play.", "Players walked out of the cornfield onto the field. The game ended 9 to 8 on a walk-off home run that landed in the corn.", "Fans asked the same question as the movie: Is this heaven? It was Iowa, and a love letter to the game."], "m86": ["For about 100 years, almost nobody both pitched and hit every week in the majors. Babe Ruth was the last to really try.", "In 2021, Shohei Ohtani pitched every sixth day and hit almost every day for the Angels.", "He hit 46 home runs, stole 26 bases and won 9 games on the mound with 156 strikeouts.", "Every single voter picked him for MVP. One player can be a star at both."], "m87": ["Albert Pujols was one of the greatest hitters ever. In 2022, at 42, he came back to St. Louis for one final season.", "Only three players had ever hit 700 home runs. He started the season far short and got hot in August.", "On September 23 in Los Angeles, he hit numbers 699 and 700 in the same game.", "He became the fourth player ever in the 700 club, then retired. A career that finished at the very top."], "m88": ["Roger Maris's American League record of 61 home runs stood for 61 years.", "In 2022 Aaron Judge chased it all season. He hit number 61, then went five games without another.", "On October 4 in Texas, in his second-to-last game, he hit number 62 into the left-field seats.", "He finished with a new American League record. Some records take a lifetime to fall."], "m89": ["The World Baseball Classic brings countries together to play. In 2023 the final was Japan against the United States.", "Japan led 3 to 2 in the ninth. Shohei Ohtani came in to pitch, and the last batter was his own Angels teammate and friend, Mike Trout.", "On a full count, Ohtani threw a sweeping slider, and Trout swung and missed.", "Japan won the title. The best facing the best, with whole countries watching."], "m90": ["Ronald Acuña Jr. came back from a serious knee injury in 2022.", "In 2023 he started stealing bases like it was a different sport and hitting for power too.", "He finished with 41 home runs and 73 stolen bases. No one had ever had 40 and 70 in the same season.", "He was the unanimous MVP. Power and speed in one player."], "m91": ["The Texas Rangers had never won the World Series. They lost in Game 6 in 2011, one strike away.", "In the 2023 playoffs they played 11 games on the road and won every single one.", "They beat Arizona in Game 5 of the World Series to win their first championship.", "Win anywhere."], "m92": ["Rickwood Field in Birmingham, Alabama, opened in 1910, the oldest professional ballpark in America. Negro Leagues teams played there for decades.", "In 2024, MLB brought a regular-season game there to honor the Negro Leagues. A young Willie Mays had started his career at Rickwood.", "Two days before the game, Mays died at 93. The night became a tribute to him and to every Negro Leagues player.", "Remembering the players and places that built the game."], "m93": ["For a century, Negro Leagues statistics were left out of baseball's official record books.", "Researchers spent years digging through old box scores and newspapers to rebuild the numbers.", "On May 29, 2024, MLB added the Negro Leagues to its records. Josh Gibson became the career leader in batting average at .372.", "History finally counted them."], "m94": ["No player had ever hit 50 home runs and stolen 50 bases in one season. In 2024 Shohei Ohtani was close on both.", "On September 19 in Miami, he came in with 48 homers and 49 steals.", "He went 6 for 6 with three home runs, two stolen bases and 10 RBIs, and the Dodgers clinched the playoffs.", "The first 50/50 season ever, all completed in one game. Maybe the greatest single game ever played."], "m95": ["Freddie Freeman hurt his ankle in September 2024 and could barely run, but he kept playing.", "In Game 1 of the World Series against the Yankees, the Dodgers trailed by one in the 10th inning with the bases loaded and two outs.", "Freeman hit the first pitch into the right-field pavilion for the first walk-off grand slam in World Series history.", "He won the World Series MVP. Play through it, and swing big."], "m96": ["In Game 4 of the 2025 NLCS, the Dodgers could clinch the pennant. Shohei Ohtani was the starting pitcher and the leadoff hitter.", "In the first inning, he struck out the side. Then he came to bat.", "He hit three home runs, one of them clear out of the stadium, and struck out 10 batters on the mound.", "The Dodgers swept to the World Series. Two players' best games, played by one person."], "m97": ["Catcher is the hardest job on the field: squatting for every pitch, calling the game and taking foul tips off your body.", "In 2025 Seattle's Cal Raleigh did all that and kept hitting home runs, chasing records no catcher had ever reached.", "He finished with 60 home runs to lead the majors, the most ever by a catcher and by a switch-hitter.", "He hit 49 of them while playing catcher. The hardest position on the field, and still the most power in the game."], "m98": ["Bristol Motor Speedway in Tennessee is a giant racetrack built for NASCAR, with grandstands that hold more than 100,000 people.", "In 2025, MLB built a real baseball field in the middle of the track for Cincinnati and Atlanta.", "They played a regular-season game there in front of the biggest crowd ever for one.", "Baseball can be played anywhere."], "m99": ["In 2025 the Dodgers tried to become the first team in 25 years to win back-to-back World Series. Game 7 was in Toronto.", "Toronto led in the ninth inning. Miguel Rojas tied it with a home run, and the game went to extra innings.", "In the 11th, Will Smith homered. Yoshinobu Yamamoto, who had started Game 6 the night before, pitched in relief to get the final outs.", "Los Angeles became the first repeat champion since 2000. Champions find a way."], "m100": ["The Milwaukee Brewers had been around since 1969 and had never won the World Series.", "In 2026 they had the best record in baseball and rolled through the playoffs.", "They beat Tampa Bay in Game 5 of the World Series to win their first championship, going 11 and 2 in the playoffs.", "After 57 years, a city that never stopped believing got its title."]};
const PAN=(m,t)=>`img/story/${m.id}${t}.jpg`,HALL=n=>`img/hall/${n}.jpg`;
function sentences(t){return t.match(/[^.!?]+[.!?]+["”’']?|[^.!?]+$/g)||[t]}
function openStory(id){const m=BY[id];if(!owned(id))return showMoment(id);const st=STORY[id];if(!st)return showMoment(id);const L=LANDS[m.land],R=RAR[m.rar];
 closeModal();document.querySelectorAll(".story").forEach(e=>e.remove());
 const CH=[{k:m.place,h:m.title,t:"",img:PAN(m,"s"),fx:"kbT",title:1},{k:"Chapter 1",h:"The Setup",t:st[0],img:PAN(m,"s"),fx:"kb1"},{k:"Chapter 2",h:"The Pressure",t:st[1],img:ART(m),fx:"kbP"},{k:"Chapter 3",h:"The Moment",t:st[2],img:ART(m),fx:"kbM"},{k:"Chapter 4",h:"Forever After",t:st[3],img:PAN(m,"a"),fb:DIO(m),fx:"kb2"}];
 const el=document.createElement("div");el.className=`story e${m.land} r-${m.rar}`;el.style.cssText=`--lc:${L.col};--ef:'${L.font}';--rc:${R[1]}`;
 el.innerHTML=`<div class="sb-stage"><div class="sb-img" id="sbA"></div><div class="sb-img" id="sbB"></div><div class="sb-flash" id="sbF"></div><div class="sb-vig"></div><div class="sb-grain"></div></div>
 <div class="sb-bars">${CH.map(()=>"<i><b></b></i>").join("")}</div><button class="sb-x" aria-label="Close story">✕</button>
 <div class="sb-text" id="sbText"></div><div class="sb-nav"><button class="sb-prev" aria-label="Back"></button><button class="sb-next" aria-label="Next"></button></div><div class="sb-hint" id="sbHint">Tap to continue</div>`;
 $("#shell").appendChild(el);let i=-1,front="sbA";
 const show=n=>{if(n<0)return;if(n>=CH.length)return finish();i=n;const c=CH[n];const nx=front==="sbA"?"sbB":"sbA";const ne=el.querySelector("#"+nx),oe=el.querySelector("#"+front);
  ne.style.backgroundImage=`url('${c.img}'),url('${c.fb||ART(m)}')`;ne.className="sb-img on "+c.fx;oe.classList.remove("on");front=nx;
  el.querySelectorAll(".sb-bars i").forEach((b,k)=>b.className=k<n?"d":k===n?"a":"");
  const T=el.querySelector("#sbText");
  if(c.title){T.className="sb-text title";T.innerHTML=`<div class="sk">${L.kind} · ${L.name}</div><div class="sy">${m.yr}</div><h2>${m.title}</h2><div class="sp">${m.place}</div><div class="sr">${R[0]} Moment</div>`;tone(330,0,.25,"triangle",.05);tone(494,.18,.3,"triangle",.05)}
  else{T.className="sb-text";T.innerHTML=`<div class="sk">${c.k}</div><h3>${c.h}</h3><p>${sentences(c.t).map((x,k)=>`<span style="animation-delay:${.35+k*.9}s">${x.trim()} </span>`).join("")}</p>`;tone(n===3?660:440,0,.12,"sine",.04)}
  if(n===3){const f=el.querySelector("#sbF");f.classList.remove("go");void f.offsetWidth;f.classList.add("go");chime(m.rar);if(m.rar==="i"){organ&&organ()}}
  el.querySelector("#sbHint").textContent=n===CH.length-1?"Tap to reveal your card":"Tap to continue"};
 const finish=()=>{const first=!S.sealed[id];if(first){S.sealed[id]=1;save()}
  el.querySelector(".sb-bars").remove();el.querySelector(".sb-nav").remove();el.querySelector("#sbHint").remove();
  const T=el.querySelector("#sbText");T.className="sb-end";T.innerHTML=`<div class="seal ${first?"new":""}">★ ${first?"Curator’s Seal earned":"Story told"}</div>${cardHTML(m)}<div class="mrow"><button class="btn" id="sbVid">▶ Watch the real Moment</button><button class="btn ghost" id="sbDio">See the exhibit case</button></div><button class="minibtn" id="sbBack">Back to ${L.wing}</button>`;
  tilt(T.querySelector(".mc"));confetti(first?80:30);if(first){chime("i");setTimeout(()=>addRep("Curator’s Seal!"),900)}
  T.querySelector("#sbVid").onclick=()=>watchReal(id);T.querySelector("#sbDio").onclick=()=>showCase(id);T.querySelector("#sbBack").onclick=close;if(wingOpen>=0&&tab==="mus")renderMus()};
 const close=()=>{el.classList.add("out");setTimeout(()=>el.remove(),350);if(tab==="mus")renderMus()};
 el.querySelector(".sb-x").onclick=close;el.querySelector(".sb-next").onclick=()=>show(i+1);el.querySelector(".sb-prev").onclick=()=>show(Math.max(0,i-1));
 el.addEventListener("keydown",e=>{if(e.key==="ArrowRight")show(i+1);if(e.key==="ArrowLeft")show(Math.max(0,i-1));if(e.key==="Escape")close()});

function showCase(id){const m=BY[id];openModal(`<div class="casezoom"><img src="${DIO(m)}" alt="Museum diorama of ${m.title}" onerror="this.onerror=null;this.src='${ART(m)}'"><div class="cz-plate"><small>${m.yr} · ${m.place}</small><b>${m.title}</b><span>Relic: ${m.relic[1]}</span></div>${HASPRESS(m)?`<div class="arch"><img src="${PRESS(m)}" alt="" loading="lazy" onerror="this.parentNode.remove()"><small>FROM THE ARCHIVE · Illustration, not a real photograph</small></div>`:""}</div>`)}
function showExhibit(id){openStory(id)}
/* ================= HALL OF FAME ================= */
function renderHall(){const n=nOwned(),told=M.filter(m=>S.sealed[m.id]).length,all=LANDS.every((_,i)=>landDone(i));
 const now=new Date(),md=String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");const dated=M.filter(m=>m.d).sort((a,b)=>a.d<b.d?-1:1);const otd=dated.find(m=>m.d>=md)||dated[0];const isToday=otd.d===md;const mon=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"][+otd.d.slice(0,2)-1];
 $("#s-mus").innerHTML=`<div class="hall">
 <section class="h-ext" style="background-image:url('${HALL("exterior")}')"><div class="h-stars"></div><div class="h-in">
  <div class="h-kick">BigDawgz · Basepaths</div><h1>The Hall of Moments</h1><p class="h-sub">One hundred of baseball’s greatest Moments. Ten galleries. One road to Cooperstown.</p>
  <div class="h-meter"><div><b>${n}</b><small>of ${M.length} enshrined</small></div><div><b>${told}</b><small>stories told</small></div><div><b>${LANDS.filter((_,i)=>landDone(i)).length}</b><small>of 10 galleries complete</small></div></div>
  <button class="btn h-enter" id="enterHall">Enter the Hall</button></div></section>
 <section class="h-rot" style="background-image:url('${HALL("rotunda")}')"><div class="h-rot-in" id="rotunda">
  <div class="h-kick">The Rotunda</div><h2>Ten galleries, one for every era</h2><p class="h-sub">Walk through baseball history in order, from the Dead-Ball Days to the Pitch-Clock Era.</p>
  <button class="otd2" id="otd"><div class="cal"><small>${mon}</small><b>${+otd.d.slice(3)}</b></div><span>${isToday?`<strong>On this day in ${otd.yr}:</strong> ${otd.title}`:`<strong>Next anniversary:</strong> ${otd.title} (${otd.yr})`}</span>›</button>
  <div class="arches">${LANDS.map((L,i)=>{const ms=landMs(i),k=ms.filter(m=>owned(m.id)).length,sd=ms.filter(m=>S.sealed[m.id]).length;return `<button class="arch e${i} ${k?"":"dim"} ${landDone(i)?"done":""}" data-w="${i}" style="--lc:${L.col};--ef:'${L.font}'"><div class="ai" style="background-image:url('${HALL("g"+i)}')"></div><div class="at"><em>${L.kind} · ${L.era}</em><b>${L.name}</b><div class="pips">${ms.map(m=>`<i class="${S.sealed[m.id]?"s":owned(m.id)?"p":""}"></i>`).join("")}</div><small>${k}/${ms.length} on display${sd?` · ${sd} told`:""}</small></div></button>`}).join("")}</div></div></section>
 <section class="h-plaq" style="background-image:url('${HALL("plaques")}')"><div class="h-in low"><div class="h-kick">At the end of the hall</div><h2>The Cooperstown Gallery</h2><p class="h-sub">${all?"The doors are open. Every Moment, all in one place.":"Its doors open when all ten galleries are complete."}</p><button class="btn ${all?"":"ghost"}" id="coopDoor">${all?"Step inside":"Locked · "+LANDS.filter((_,i)=>landDone(i)).length+"/10 galleries"}</button></div></section></div>`;
 $("#enterHall").onclick=()=>{$("#rotunda").scrollIntoView({behavior:"smooth"});tone(392,0,.2,"triangle")};
 $("#otd").onclick=()=>(owned(otd.id)&&!S.sealed[otd.id])?openStory(otd.id):showMoment(otd.id);
 document.querySelectorAll(".arch[data-w]").forEach(d=>d.onclick=()=>{wingOpen=+d.dataset.w;tone(392,0,.2,"triangle");tone(523,.15,.25,"triangle");renderMus();$("#s-mus").scrollTop=0});
 $("#coopDoor").onclick=()=>all?(go("col")):toast("Complete all ten galleries to open the Cooperstown Gallery")}
function renderGallery(i){const L=LANDS[i],ms=landMs(i).sort((a,b)=>a.yr-b.yr),k=ms.filter(m=>owned(m.id)).length,sd=ms.filter(m=>S.sealed[m.id]).length;const pv=LANDS[i-1],nx=LANDS[i+1];
 $("#s-mus").innerHTML=`<div class="gal e${i}" style="--lc:${L.col};--ef:'${L.font}'"><div class="g-bg" style="background-image:url('${HALL("g"+i)}')"></div>
 <div class="g-bar"><button class="back" id="gBack">‹ Rotunda</button><span>${i+1} / 10</span></div>
 <header class="g-head"><em>${L.kind} · ${L.era}</em><h2>${L.name}</h2><p>${L.tag}</p><div class="g-stat"><span>${k}/${ms.length} on display</span><span>${sd} stories told</span>${landDone(i)?`<span class="ok">★ Gallery complete</span>`:""}</div></header>
 <div class="g-cases">${ms.map(m=>{const o=owned(m.id),sl=S.sealed[m.id];return o?`<button class="gcase r-${m.rar} ${sl?"told":""}" data-id="${m.id}"><div class="gc-glass"><div class="gc-img" style="background-image:url('${DIO(m)}'),url('${ART(m)}')"></div><div class="gc-shine"></div></div><div class="gc-plate"><small>${m.yr} · ${RAR[m.rar][0]}</small><b>${m.title}</b><span>${sl?"★ Story told":"▶ Enter the story"}</span></div></button>`:`<button class="gcase lock" data-id="${m.id}"><div class="gc-glass"><div class="gc-img sil"></div><div class="gc-q">?</div></div><div class="gc-plate"><small>${m.yr}</small><b>Sealed exhibit</b><span>Find it in a Time Capsule</span></div></button>`}).join("")}</div>
 <div class="g-walk">${pv?`<button class="gw" data-w="${i-1}"><small>‹ Previous gallery</small><b>${pv.name}</b></button>`:"<span></span>"}${nx?`<button class="gw r" data-w="${i+1}"><small>Next gallery ›</small><b>${nx.name}</b></button>`:`<button class="gw r" id="gEnd"><small>End of the hall ›</small><b>Cooperstown</b></button>`}</div></div>`;
 $("#gBack").onclick=()=>{wingOpen=-1;renderMus();setTimeout(()=>{const r=$("#rotunda");r&&r.scrollIntoView()},30)};
 document.querySelectorAll(".gw[data-w]").forEach(b=>b.onclick=()=>{wingOpen=+b.dataset.w;tone(392,0,.18,"triangle");renderMus();$("#s-mus").scrollTop=0});
 const ge=$("#gEnd");if(ge)ge.onclick=()=>{wingOpen=-1;renderMus();setTimeout(()=>$("#s-mus").scrollTo({top:$("#s-mus").scrollHeight,behavior:"smooth"}),30)};

function shuffleIdx(n,seed){const a=[...Array(n).keys()];let s=[...seed].reduce((x,c)=>x+c.charCodeAt(0),0);for(let i=n-1;i>0;i--){s=(s*9301+49297)%233280;const j=s%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}

/* ================= COLLECTION ================= */
function renderCol(){$("#s-col").innerHTML=`<div class="sec"><h2 class="h1">Your Collection</h2><p class="sub">${nOwned()} of ${M.length} Moments · ${THREADS.filter(thrDone).length} of ${THREADS.length} threads</p>
 ${LANDS.map((L0,li)=>`<div class="colh e${li}" style="--lc:${L0.col};--ef:'${L0.font}'"><div class="ck"><span>${L0.kind}</span><span>${L0.era} · ${landMs(li).filter(m=>owned(m.id)).length}/${landMs(li).length}</span></div><b>${L0.name}</b><i>${L0.tag}</i></div><div class="grid">${landMs(li).sort((a,b)=>a.yr-b.yr).map(m=>{const o=owned(m.id),L=LANDS[m.land],R=RAR[m.rar];return `<button class="tile e${m.land} ${o?"":"lock"}" data-id="${m.id}" style="--lc:${L.col};--ef:'${L.font}';${o?`--rc:${R[1]}`:""}"><div class="sc">${art(m)}</div><div class="tx"><b>${o?m.title:"???"}</b><small>${m.yr}${o?" · "+R[0]:""}</small></div></button>`}).join("")}</div>`).join("")}
 <div class="threads"><h2 class="h1" style="font-size:26px">Threads</h2><p class="sub">Some Moments are connected. Collect a whole thread to draw its constellation across the map.</p>${THREADS.map(t=>{const d=thrDone(t);return `<div class="th ${d?"done":""}"><div class="star"><svg width="26" height="26" viewBox="0 0 24 24"><path d="M12 2l3 7h7l-5.5 4.5L18 21l-6-4-6 4 1.5-7.5L2 9h7z" fill="${d?"#2a1a04":"#3a4470"}"/></svg></div><div style="flex:1"><b>${t.name}</b><p>${t.txt}</p><div class="dots">${t.ids.map(id=>`<i class="${owned(id)?"f":""}" title="${BY[id].yr}"></i>`).join("")}</div></div></div>`}).join("")}</div></div>`;
 document.querySelectorAll(".tile").forEach(t=>t.onclick=()=>showMoment(t.dataset.id))}

/* ================= NOTES ================= */
function notes(){openModal(`<div class="notes"><h3>What’s in this build</h3>
 <h4>The map</h4><ul><li><b>The Hall of Fame:</b> 100 Moments in ten galleries, one for each real era of baseball, from the Dead-Ball Days (1869) to the Pitch-Clock Era (2026). Each gallery has its own architecture, card frame and lettering, and the art changes with the times: oil paintings for the early eras, then film and digital photos.</li><li>Fill a gallery to complete it. Complete all ten and the Cooperstown Gallery opens, a nod to the team’s summer trip.</li><li><b>Threads:</b> connected Moments (Home Run Kings, Iron Men, Game 7 Club, Michigan Made…) shown in the Collection.</li><li><b>On This Day:</b> the rotunda shows the next Moment anniversary.</li></ul>
 <h4>Time Capsules</h4><ul><li>Earned from homework and Curator’s Seals, never bought. The capsule shakes, a year dial spins back through time, then the light color tells the rarity before the Moment appears.</li><li>Immortal pulls get the organ, gold rays and confetti.</li></ul>
 <h4>Hall of Moments (museum)</h4><ul><li><b>Every Moment is a story:</b> a title card, then four illustrated chapters (The Setup, The Pressure, The Moment, Forever After) with slow cinematic camera moves, ending with the card and the real 30-second clip.</li><li>Finish a Moment’s story to earn its Curator’s Seal and +1 rep toward the next capsule, so learning feeds collecting.</li></ul>
 <h4>The art</h4><ul><li><b>Card fronts:</b> oil paintings through 1960, then era-matched photos from 1970s film to modern HDR.</li><li><b>Immortal pulls:</b> a movie-style scene fills the screen before the card lands.</li><li><b>Museum cases:</b> a miniature diorama of each Moment. Pre-1970 wings also hang archive-style prints, labeled as illustrations.</li><li><b>Hall architecture:</b> the building, rotunda and ten era galleries.</li><li>All art made free with Google Flow (one diorama from Hugging Face).</li></ul><h4>How it stays on the safe side</h4><ul><li>The Moment is the headline, never a player’s name.</li><li>Original art: players from behind or far away, no faces, likenesses, team logos or team nicknames.</li><li>No player ratings or abilities. Stories are written in our own words, mostly about history.</li></ul>
 <h4>Demo controls</h4><div class="mrow" style="flex-wrap:wrap;margin-top:8px"><button class="btn" id="dFill">Fill the map</button><button class="btn ghost" id="dCaps">+5 capsules</button><button class="btn ghost" id="dReset">Reset</button></div></div>`);
 $("#dFill").onclick=()=>{M.forEach((m,i)=>S.owned[m.id]=S.owned[m.id]||Date.now()+i*977);LANDS.forEach((_,i)=>S.lands[i]=1);THREADS.forEach(t=>S.threads[t.id]=1);S.coop=1;save();closeModal();renderAll();confetti(120);organ()};
 $("#dCaps").onclick=()=>{S.caps+=5;save();closeModal();renderAll();go("caps")};
 $("#dReset").onclick=()=>{const snd=S.sound;S=fresh();S.sound=snd;save();closeModal();wingOpen=-1;renderMap._init=0;renderAll();go("mus")}}

;(()=>{const b=document.getElementById("prevBtn");const paint=()=>{b.style.background=PREV?"linear-gradient(135deg,#ffd25a,#ff9f43)":"";b.style.color=PREV?"#1a1205":""};paint();b.onclick=()=>{PREV=!PREV;try{localStorage.setItem("bp-preview",PREV?"1":"0")}catch(e){}paint();toast(PREV?"Preview on: every Moment revealed":"Preview off: back to your real collection");renderAll()}})();
