<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3c1e0c">
<title>Drill library: 3 looks · Basepaths</title>
<link rel="icon" href="../../assets/img/team-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="preview.css">
</head>
<body>
<img class="bgfill" src="../../assets/img/park.jpg" alt="">
<div class="pv-app">
  <header class="pv-top">
    <a class="pv-rb" href="../" aria-label="Back to the Bullpen"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <div class="pv-tt"><img src="../../assets/img/bats.png" alt=""><span><b>Drill Library</b><small>Pick the look you like</small></span></div>
  </header>
  <div class="pv-pick" role="tablist" aria-label="Library looks">
    <button role="tab" data-look="map" aria-selected="true">⚾ Field map</button>
    <button role="tab" data-look="deck" aria-selected="false">🃏 Swipe deck</button>
    <button role="tab" data-look="binder" aria-selected="false">📒 Card binder</button>
  </div>
  <div class="pv-filt" role="group" aria-label="Where are you?">
    <button data-where="" aria-pressed="true">Anywhere</button>
    <button data-where="inside" aria-pressed="false">🛋️ Indoors</button>
    <button data-where="yard" aria-pressed="false">🌳 Backyard</button>
    <button data-where="field" aria-pressed="false">🏟️ Field</button>
  </div>
  <main id="pv" tabindex="-1"></main>
</div>
<div id="pvSheet" class="pv-sheet" aria-hidden="true"></div>
<script src="../../assets/profile.js"></script>
<script src="../../assets/drills/data.js"></script>
<script src="preview.js"></script>
</body>
</html>
