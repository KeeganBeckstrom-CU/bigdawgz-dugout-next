<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3c1e0c">
<title>Arcade · BigDawgz Dugout</title>
<link rel="icon" href="../assets/img/team-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/arcade/arcade.css">
</head>
<body>
<img class="bgfill" src="../assets/img/park.jpg" alt="">
<div class="app">
  <header class="ghead">
    <a class="gx" href="../clubhouse/" aria-label="Back to the Clubhouse"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <span><b>Clubhouse</b></span>
    <span class="coins" aria-label="Your XP"><img src="../assets/img/coin.png" alt=""><b id="xp">0</b></span>
  </header>
  <div class="hubtitle"><img src="../assets/img/ball.png" alt=""><div><h1>Arcade</h1><p>Get smarter while you have fun.</p></div></div>
  <p class="legend"><span class="pips"><i class="on"></i><i class="on"></i><i></i><i></i></span> Lights show the levels you've finished: Easy, Medium, Hard, Expert.</p>
  <div id="hub"></div>
</div>
<script src="../assets/sound.js"></script>
<script src="../assets/profile.js"></script>
<script src="../assets/arcade/data.js"></script>
<script>
(function () {
  var A = window.ARC, p = Profile.data;
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function game(k) { return A.GAMES.find(function (g) { return g[0] === k; }); }
  document.getElementById('xp').textContent = p.xp.toLocaleString();
  var FXG = [['derby', 'Home Run Derby', 'Swing for the fences. Lay off the bad ones.'], ['bases', 'Run the Bases', 'Read the ball, read the coach. Go or stay?'], ['glove', 'Gold Glove', 'Get in front of the grounder, then make the throw.'], ['ace', 'Ace', 'Pick the pitch, hit your spot, win the count.'], ['corn', 'Can of Corn', 'Read the fly ball, then hit your cutoff.']];
  var fxHTML = '<h2 class="grp"><b>Play ball</b><span>new · play it out on the field</span></h2><div class="cards feat">' + FXG.map(function (g) {
    var k = g[0], hs = p.hs[k], pips = [0, 1, 2, 3].map(function (i) { return '<i class="' + (p.best[i ? k + '_' + i : k] != null ? 'on' : '') + '"></i>'; }).join('');
    return '<a class="gcard big" href="fx.html?g=' + k + '"><img src="../assets/img/games/' + k + '.png" alt=""><b>' + esc(g[1]) + '</b><small>' + esc(g[2]) + '</small><span class="meta"><span class="pips" aria-label="Levels finished">' + pips + '</span><span class="hs">' + (hs ? hs.s + ' pts' : '') + '</span></span></a>';
  }).join('') + '</div>';
  document.getElementById('hub').innerHTML = fxHTML + A.GGROUPS.map(function (gr) {
    return '<h2 class="grp"><b>' + esc(gr[0]) + '</b><span>' + esc(gr[1]) + '</span></h2><div class="cards">' + gr[2].map(function (k) {
      var g = game(k), hs = p.hs[k];
      var pips = [0, 1, 2, 3].map(function (i) { return '<i class="' + (p.best[i ? k + '_' + i : k] != null ? 'on' : '') + '"></i>'; }).join('');
      return '<a class="gcard" href="game.html?g=' + k + '"><img src="../assets/img/games/' + k + '.png" alt=""><b>' + esc(g[2]) + '</b><small>' + esc(g[3]) + '</small><span class="meta"><span class="pips" aria-label="Levels finished">' + pips + '</span><span class="hs">' + (hs ? hs.s + ' pts' : '') + '</span></span></a>';
    }).join('') + '</div>';
  }).join('');
  document.querySelectorAll('.gcard').forEach(function (a) { a.addEventListener('click', function () { Sound.tone(660, .07, 'sine', .06); }); });
})();
</script>
</body>
</html>
